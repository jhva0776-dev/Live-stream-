<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional 24/7 YouTube Streamer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
    h3 { color: #e2e8f0; font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9rem; color: #94a3b8; }
    input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 0.95rem; }
    .checkbox-container { margin-top: 15px; display: flex; align-items: center; gap: 10px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn-start { background: #22c55e; color: #000; }
    .btn-start:hover { background: #16a34a; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-upload { background: #3b82f6; color: #fff; }
    .btn-upload:hover { background: #2563eb; }
    .status { font-weight: bold; padding: 6px 12px; border-radius: 6px; display: inline-block; font-size: 0.9rem; }
    .status.LIVE { background: #22c55e; color: #000; }
    .status.STOPPED { background: #ef4444; color: #fff; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .timer-box { font-size: 1.2rem; font-weight: bold; color: #22d3ee; font-family: monospace; margin-top: 10px; }
    #msg { margin-top: 12px; padding: 10px; border-radius: 6px; background: #0f172a; font-size: 0.9rem; color: #cbd5e1; word-break: break-all; border-left: 4px solid #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h2>24/7 Cloud Streamer</h2>

    <div class="card">
      <h3>1. Upload Video File</h3>
      <form id="uploadForm">
        <input type="file" id="videoInput" accept="video/*" required>
        <button type="submit" class="btn-upload">Upload to Cloud</button>
      </form>
    </div>

    <div class="card">
      <h3>2. Stream Configuration</h3>
      <label>RTMP Server URL</label>
      <input type="text" id="rtmpUrl" value="rtmp://a.rtmp.youtube.com/live2">

      <label>YouTube Stream Key</label>
      <input type="text" id="streamKey" placeholder="Paste your clean stream key here">

      <div class="checkbox-container">
        <input type="checkbox" id="loopVideo" checked style="width: 20px; height: 20px;">
        <label for="loopVideo" style="margin:0; color: #f8fafc;">Continuous 24/7 Loop</label>
      </div>
    </div>

    <div class="card">
      <h3>3. Control & Live Diagnostics</h3>
      <div class="info-row">
        <span>Status:</span>
        <span id="streamStatus" class="status STOPPED">STOPPED</span>
      </div>
      <div class="timer-box">Uptime: <span id="timer">00:00:00</span></div>
      
      <button class="btn-start" onclick="startStream()">Start Stream</button>
      <button class="btn-stop" onclick="stopStream()">Stop Stream</button>
      
      <label style="margin-top: 15px;">System Diagnostic Log:</label>
      <div id="msg">System ready. Upload a video and start stream.</div>
    </div>
  </div>

  <script>
    const msg = document.getElementById('msg');
    let streamStartTime = null;

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('videoInput');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('video', fileInput.files[0]);

      msg.innerText = "Uploading video to cloud server, please wait...";
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        msg.innerText = data.message || data.error;
      } catch (err) {
        msg.innerText = "Upload failed network error.";
      }
    });

    async function startStream() {
      const rtmpUrl = document.getElementById('rtmpUrl').value;
      const streamKey = document.getElementById('streamKey').value;
      const loop = document.getElementById('loopVideo').checked;

      msg.innerText = "Initiating stream sequence...";
      try {
        const res = await fetch('/api/start-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rtmpUrl, streamKey, loop })
        });
        const data = await res.json();
        msg.innerText = data.message || data.error;
      } catch (err) {
        msg.innerText = "Failed to trigger stream request.";
      }
    }

    async function stopStream() {
      msg.innerText = "Stopping stream...";
      try {
        const res = await fetch('/api/stop-stream', { method: 'POST' });
        const data = await res.json();
        msg.innerText = data.message || data.error;
      } catch (err) {
        msg.innerText = "Failed to stop stream.";
      }
    }

    function updateTimer() {
      if (!streamStartTime) {
        document.getElementById('timer').innerText = "00:00:00";
        return;
      }
      const now = Date.now();
      const diff = Math.floor((now - streamStartTime) / 1000);
      
      const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
      const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
      const secs = String(diff % 60).padStart(2, '0');

      document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
    }

    setInterval(async () => {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const statusEl = document.getElementById('streamStatus');
        statusEl.innerText = data.status;
        statusEl.className = 'status ' + data.status;
        
        if (data.status === 'LIVE' && data.startTime) {
          streamStartTime = data.startTime;
          updateTimer();
        } else {
          streamStartTime = null;
          updateTimer();
          if (data.lastError && data.lastError !== 'None' && data.lastError !== 'Stream stopped manually by user.') {
            // Show error if it stopped unexpectedly
            // msg.innerText = "FFmpeg Log: " + data.lastError;
          }
        }
      } catch (e) {
        // ignore background poll errors
      }
    }, 1000);
  </script>
</body>
</html>
